name: Deploy to GitHub Pages

on:
  push:
    branches: [rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # peaceiris/actions-gh-pages has no Node-24 major yet; force its JS action
    # (and any other) onto the Node 24 runtime so the deploy survives GitHub's
    # June 2026 removal of Node 20. actions/* are already on Node-24-native v6.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # src/config/variables.json against its references and the built data.
      # The build runs the same check; this step just reports it on its own.
      - name: Check variables
        run: npm run check
        working-directory: web

      - name: Build
        run: npx vite build
        working-directory: web

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
