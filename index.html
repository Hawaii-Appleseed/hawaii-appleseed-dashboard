<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hawaii Appleseed Data Dashboard</title>
    <!-- maplibre-gl.css is imported from JS (in mapInstance.js) so Vite bundles it locally. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/hawaii-appleseed-dashboard/assets/main-XJcBpPGY.js"></script>
    <link rel="modulepreload" crossorigin href="/hawaii-appleseed-dashboard/assets/loader-CrygnVjz.js">
    <link rel="modulepreload" crossorigin href="/hawaii-appleseed-dashboard/assets/store-shgm4nmu.js">
    <link rel="stylesheet" crossorigin href="/hawaii-appleseed-dashboard/assets/store-C2xGuNdq.css">
    <link rel="stylesheet" crossorigin href="/hawaii-appleseed-dashboard/assets/main-CuCRB34y.css">
  </head>
  <body>
    <main class="app-main">
      <h1 class="sr-only">Hawaii Appleseed Data Dashboard</h1>
      <nav class="seg main-tabs" role="tablist" aria-label="View">
        <button class="seg-btn main-tab active" data-tab="map" role="tab" aria-selected="true" aria-controls="tab-map">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="tab-icon" aria-hidden="true"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
          <span class="seg-label">Map</span>
        </button>
        <button class="seg-btn main-tab" data-tab="data" role="tab" aria-selected="false" aria-controls="tab-data">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="tab-icon" aria-hidden="true"><rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/></svg>
          <span class="seg-label">Data</span>
        </button>
      </nav>

      <div id="tab-map" class="tab-pane" role="tabpanel">
        <!-- Phones: one row standing in for the controls bar (sidebar.js). -->
        <button id="controls-toggle" class="controls-toggle" type="button" aria-expanded="false" aria-controls="controls-bar">
          <span class="ct-text"><span class="ct-var"></span><span class="ct-geo"></span></span>
          <span class="ct-action">Change<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
        </button>
        <div id="controls-bar" class="controls-bar">
        </div>
        <button id="fullscreen-btn" class="btn btn-secondary fullscreen-btn" type="button" aria-label="Open in a new tab" title="Open in a new tab" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Open
        </button>
        <section class="map-wrap">
          <!-- "Find an area": a map button under zoom/reset that opens the
               search box beside it (areaSearch.js). -->
          <div id="area-search" class="area-search" role="search">
            <button type="button" class="area-search-btn" aria-expanded="false" aria-controls="area-search-pop" aria-label="Find an area" title="Find an area (/)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </button>
            <div id="area-search-pop" class="area-search-pop" hidden>
              <input type="text" role="combobox" aria-expanded="false" aria-controls="area-search-list" aria-autocomplete="list" aria-label="Find a county or district" placeholder="Find a county" autocomplete="off" spellcheck="false" />
              <ul id="area-search-list" class="area-list" role="listbox" aria-label="Areas" hidden></ul>
            </div>
          </div>
          <div id="main-map" class="map-container"></div>
          <div id="main-map-legend" class="map-legend">
            <div class="legend-head">
              <div class="legend-title"></div>
              <button type="button" id="map-options-btn" class="icon-btn" aria-expanded="false" aria-controls="map-options" aria-label="Map options" title="Map options">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.5" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="2.5" fill="currentColor" stroke="none"/></svg>
              </button>
            </div>
            <div id="main-map-legend-items" class="legend-scale">
              <div class="legend-bar"></div>
              <div class="legend-ticks"></div>
            </div>
            <div class="legend-source"></div>
            <div id="reliability-key" class="legend-key" hidden></div>
            <div id="millionaires-key" class="legend-key" hidden></div>
            <div id="map-options" class="map-options" role="group" aria-label="Map options" hidden>
              <div class="mo-section mo-scheme">
                <div class="mo-label" id="mo-scheme-label">Color scheme</div>
                <div id="color-scheme-options" class="mo-schemes" role="radiogroup" aria-labelledby="mo-scheme-label"></div>
              </div>
              <label class="mo-section mo-switch mo-reliability">
                <span class="mo-switch-text">
                  <span class="mo-switch-title">Flag low-reliability areas</span>
                  <span class="mo-switch-help" id="reliability-help"></span>
                </span>
                <input type="checkbox" role="switch" id="reliability-toggle" class="switch" aria-describedby="reliability-help" />
              </label>
              <label class="mo-section mo-switch mo-millionaires">
                <span class="mo-switch-text">
                  <span class="mo-switch-title">Show millionaires</span>
                  <span class="mo-switch-help" id="millionaires-help"></span>
                </span>
                <input type="checkbox" role="switch" id="millionaires-toggle" class="switch" aria-describedby="millionaires-help" />
              </label>
            </div>
          </div>
          <div id="info-panel" class="info-panel" role="region" aria-label="Selected area"></div>
        </section>
      </div>

      <div id="tab-data" class="tab-pane" role="tabpanel" hidden>
        <div class="da-controls-row">
          <div id="da-controls" class="da-controls"></div>
        </div>
        <div class="da-chart-row">
          <div class="da-chart-wrap">
            <p class="da-section-label">Ranked comparison</p>
            <div id="da-chart"></div>
          </div>
          <div class="da-table-wrap">
            <div class="da-section-head">
              <p class="da-section-label">Selected variable</p>
              <button id="da-side-download" type="button" class="da-download-btn" title="Download CSV">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>CSV</span>
              </button>
            </div>
            <div id="da-side-table"></div>
          </div>
        </div>
        <hr class="da-divider" />
        <div class="da-section-head">
          <p class="da-section-label">Full data table</p>
          <button id="da-full-download" type="button" class="da-download-btn da-download-btn-primary" title="Download full table as CSV">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Download CSV</span>
          </button>
        </div>
        <div id="da-full-table" class="da-full-table-wrap" tabindex="0" role="region" aria-label="Full data table"></div>
      </div>
    </main>

  </body>
</html>
